<div class="rp-gauge-item">
  <div class="rp-gauge" anvil:name="gauge">
    <div class="top"><span><i class="ic" anvil:name="icon"></i> <anvil-component type="Label" name="name_label"></anvil-component></span><anvil-component type="Label" name="value_label" prop:role='["gauge-value"]'></anvil-component></div>
    <div class="bar"><i anvil:name="fill"></i></div>
    <anvil-component type="Label" name="error_label" prop:role='["gauge-error"]'></anvil-component>
  </div>
</div>
