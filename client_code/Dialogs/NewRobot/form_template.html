<div class="ui nr-dialog">
  <h2 class="dlg-h">New robot</h2>
  <div class="ui-stack">
    <label class="ui-field"><span>Name</span>
      <anvil-component type="TextBox" name="name_box" prop:placeholder="e.g. Sprocket"></anvil-component>
    </label>
    <div class="ui-field"><span>Its brain</span>
      <div class="gr-presets" role="radiogroup" aria-label="Its brain">
        <label class="ui-choice"><input type="radio" name="nr-preset" value="pi" checked anvil:dom-node="p_pi"><span><i class="ic ic-chip"></i><b>Raspberry Pi</b><small>Camera, motor driver and servos all wired to the Pi. The usual build.</small></span></label>
        <label class="ui-choice"><input type="radio" name="nr-preset" value="pi_arduino" anvil:dom-node="p_pi_arduino"><span><i class="ic ic-plug"></i><b>Raspberry Pi + Arduino</b><small>The Pi streams video; an Arduino over USB runs motors, servos and sensors, and reports what it has.</small></span></label>
        <label class="ui-choice"><input type="radio" name="nr-preset" value="browser" anvil:dom-node="p_browser"><span><i class="ic ic-phone"></i><b>Phone or laptop</b><small>An old phone or laptop rides on the robot and runs it from a browser tab. Start with simulated parts.</small></span></label>
      </div>
    </div>
    <div class="ui-field"><span>Paint</span>
      <anvil-component type="Robo_Presence.Components.Swatches" name="paint"></anvil-component>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="build_button" prop:text="Build it" prop:role='["btn", "btn-primary", "ic-plus"]'></anvil-component>
    </div>
  </div>
</div>
