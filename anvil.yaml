    Makers, and families who want a robot to visit through\"}}, {\"@type\": \"WebSite\", \"@id\": \"https://robo-presence.anvil.app/#site\"\
    , \"url\": \"https://robo-presence.anvil.app/\", \"name\": \"Robo Presence\", \"publisher\": {\"@id\": \"https://arkvital.com/#org\"\
    }}, {\"@type\": \"Organization\", \"@id\": \"https://arkvital.com/#org\", \"name\": \"Arkvital\", \"url\": \"https://arkvital.com\"\
