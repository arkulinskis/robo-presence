    \ and drive it live from any browser over WebRTC.\">\n<meta property=\"og:locale\" content=\"en_CA\">\n<meta property=\"\
    og:url\" content=\"https://robo-presence.anvil.app/\">\n<meta property=\"og:image\" content=\"https://robo-presence.anvil.app/_/theme/og-image.png\"\
    >\n<meta property=\"og:image:width\" content=\"1200\"><meta property=\"og:image:height\" content=\"630\">\n<meta property=\"\
    og:image:alt\" content=\"Robo Presence: Build a camera robot. Drive it from anywhere.\">\n<meta name=\"twitter:card\"\
    \ content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Robo Presence: DIY telepresence robot in your\
    \ browser\">\n<meta name=\"twitter:description\" content=\"Build a camera robot on wheels with a Raspberry Pi, an Arduino\
    \ or an old phone, install it with one command, and drive it live from any browser over WebRTC.\">\n<meta name=\"twitter:image\"\
    \ content=\"https://robo-presence.anvil.app/_/theme/og-image.png\">\n<link rel=\"alternate\" type=\"text/plain\" title=\"\
