metadata:
  description: Build a camera robot on wheels with a Raspberry Pi, an Arduino or an old phone, install it with one command,
    and drive it live from any browser over WebRTC.
  logo_img: asset:icon-512.png
  title: 'Add a Robot: DIY telepresence robot in your browser'
name: Add a Robot
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=3ffbd9c686"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/robopresence.json and run seo.py, not here) -->
    <link rel="canonical" href="https://addarobot.com/">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="telepresence robot, Raspberry Pi robot, DIY telepresence robot, WebRTC robot control, remote control robot browser, Arduino robot car, Raspberry Pi camera robot, robot simulator, pan tilt camera robot">
